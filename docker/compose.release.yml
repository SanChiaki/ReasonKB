name: reasonkb

services:
  web:
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/web.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    ports:
      - "${WEB_PORT:-43170}:3000"
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      RETRIEVAL_API_BASE_URL: http://retrieval-api:8001
      PROJECTS_ROOT: /data/projects
      REASONKB_CURRENT_PROJECTS_ROOT: ${REASONKB_PROJECTS_ROOT:-./projects}
      REASONKB_HOST_BROWSE_ROOT: ${REASONKB_HOST_BROWSE_ROOT:-${HOME:-.}}
      REASONKB_HOST_BROWSE_CONTAINER_ROOT: /host-browse
      REASONKB_ENV_FILE_PATH: /app/runtime.env
      REASONKB_COMPOSE_COMMAND: docker compose --env-file ${REASONKB_ENV_FILE:-./.env} -f compose.yml up -d --force-recreate --remove-orphans
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_HOST_BROWSE_ROOT:-${HOME:-.}}:/host-browse:ro
      - ${REASONKB_ENV_FILE:-./.env}:/app/runtime.env
    depends_on:
      retrieval-api:
        condition: service_healthy

  retrieval-api:
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/retrieval-api.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    ports:
      - "${RETRIEVAL_API_PORT:-43171}:8001"
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_EXTRACTION_ENABLED: ${VISION_EXTRACTION_ENABLED:-false}
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  index-worker:
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/index-worker.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      OFFICE_CONVERSION_TIMEOUT_SECONDS: ${OFFICE_CONVERSION_TIMEOUT_SECONDS:-120}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_EXTRACTION_ENABLED: ${VISION_EXTRACTION_ENABLED:-false}
      INDEX_DEBUG_METRICS: ${INDEX_DEBUG_METRICS:-false}
      INDEX_JOB_TIMEOUT_SECONDS: ${INDEX_JOB_TIMEOUT_SECONDS:-1800}
      INDEX_WORKER_CONCURRENCY: ${INDEX_WORKER_CONCURRENCY:-1}
      REASONKB_CORPUS_SOURCE: ${REASONKB_CORPUS_SOURCE:-local}
      REASONKB_SMB_HOST: ${REASONKB_SMB_HOST:-}
      REASONKB_SMB_SHARE: ${REASONKB_SMB_SHARE:-}
      REASONKB_SMB_BASE_PATH: ${REASONKB_SMB_BASE_PATH:-}
      REASONKB_SMB_USERNAME_FILE: ${REASONKB_SMB_USERNAME_FILE:-/app/secrets/smb_username}
      REASONKB_SMB_PASSWORD_FILE: ${REASONKB_SMB_PASSWORD_FILE:-/app/secrets/smb_password}
      REASONKB_SMB_DOMAIN: ${REASONKB_SMB_DOMAIN:-}
      REASONKB_SMB_PORT: ${REASONKB_SMB_PORT:-445}
      REASONKB_SMB_AUTH_PROTOCOL: ${REASONKB_SMB_AUTH_PROTOCOL:-ntlm}
      REASONKB_REMOTE_CACHE_ROOT: ${REASONKB_REMOTE_CACHE_ROOT:-/app/var/remote-cache}
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}:/app/secrets:ro
    depends_on:
      retrieval-api:
        condition: service_healthy
      gotenberg:
        condition: service_started

  directory-watcher:
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/directory-watcher.sh"]
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      DIRECTORY_SCAN_INTERVAL_SECONDS: ${DIRECTORY_SCAN_INTERVAL_SECONDS:-5}
      REASONKB_CORPUS_SOURCE: ${REASONKB_CORPUS_SOURCE:-local}
      REASONKB_SMB_HOST: ${REASONKB_SMB_HOST:-}
      REASONKB_SMB_SHARE: ${REASONKB_SMB_SHARE:-}
      REASONKB_SMB_BASE_PATH: ${REASONKB_SMB_BASE_PATH:-}
      REASONKB_SMB_USERNAME_FILE: ${REASONKB_SMB_USERNAME_FILE:-/app/secrets/smb_username}
      REASONKB_SMB_PASSWORD_FILE: ${REASONKB_SMB_PASSWORD_FILE:-/app/secrets/smb_password}
      REASONKB_SMB_DOMAIN: ${REASONKB_SMB_DOMAIN:-}
      REASONKB_SMB_PORT: ${REASONKB_SMB_PORT:-445}
      REASONKB_SMB_AUTH_PROTOCOL: ${REASONKB_SMB_AUTH_PROTOCOL:-ntlm}
      REASONKB_REMOTE_CACHE_ROOT: ${REASONKB_REMOTE_CACHE_ROOT:-/app/var/remote-cache}
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}:/app/secrets:ro
    depends_on:
      retrieval-api:
        condition: service_healthy

  gotenberg:
    image: ${GOTENBERG_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:gotenberg-8}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    ports:
      - "${GOTENBERG_PORT:-43172}:3000"
