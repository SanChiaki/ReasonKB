name: reasonkb

services:
  migrate:
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/migrate.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      REASONKB_CORPUS_SOURCE: ${REASONKB_CORPUS_SOURCE:-local}
      REASONKB_SMB_HOST: ${REASONKB_SMB_HOST:-}
      REASONKB_SMB_SHARE: ${REASONKB_SMB_SHARE:-}
      REASONKB_SMB_BASE_PATH: ${REASONKB_SMB_BASE_PATH:-}
      REASONKB_SMB_PORT: ${REASONKB_SMB_PORT:-445}
      REASONKB_SMB_DOMAIN: ${REASONKB_SMB_DOMAIN:-}
      REASONKB_SMB_AUTH_PROTOCOL: ${REASONKB_SMB_AUTH_PROTOCOL:-ntlm}
      REASONKB_MASTER_KEY_FILE: /run/secrets/reasonkb_master_key
      REASONKB_ADMIN_PASSWORD_FILE: /run/secrets/reasonkb_admin_password
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_SECRETS_ROOT:-./secrets}/master.key:/run/secrets/reasonkb_master_key:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}/admin_password:/run/secrets/reasonkb_admin_password:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}:/run/reasonkb-legacy-secrets:ro

  web:
    restart: unless-stopped
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/web.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    ports:
      - "${WEB_PORT:-43170}:3000"
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      RETRIEVAL_API_BASE_URL: http://retrieval-api:8001
      PROJECTS_ROOT: /data/projects
      REASONKB_CURRENT_PROJECTS_ROOT: ${REASONKB_PROJECTS_ROOT:-./projects}
      REASONKB_HOST_BROWSE_ROOT: ${REASONKB_HOST_BROWSE_ROOT:-${HOME:-.}}
      REASONKB_HOST_BROWSE_CONTAINER_ROOT: /host-browse
      REASONKB_ENV_FILE_PATH: /app/runtime.env
      REASONKB_COMPOSE_COMMAND: docker compose --env-file ${REASONKB_ENV_FILE:-./.env} -f compose.yml up -d --force-recreate --remove-orphans
      REASONKB_CORPUS_SOURCE: ${REASONKB_CORPUS_SOURCE:-local}
      REASONKB_SMB_HOST: ${REASONKB_SMB_HOST:-}
      REASONKB_SMB_SHARE: ${REASONKB_SMB_SHARE:-}
      REASONKB_SMB_BASE_PATH: ${REASONKB_SMB_BASE_PATH:-}
      REASONKB_SMB_PORT: ${REASONKB_SMB_PORT:-445}
      REASONKB_SMB_DOMAIN: ${REASONKB_SMB_DOMAIN:-}
      REASONKB_SMB_AUTH_PROTOCOL: ${REASONKB_SMB_AUTH_PROTOCOL:-ntlm}
      REASONKB_MASTER_KEY_FILE: /run/secrets/reasonkb_master_key
      REASONKB_ADMIN_PASSWORD_FILE: /run/secrets/reasonkb_admin_password
      REASONKB_API_KEY_PEPPER_FILE: /run/secrets/reasonkb_api_key_pepper
      REASONKB_ADMIN_COOKIE_SECURE: ${REASONKB_ADMIN_COOKIE_SECURE:-auto}
      REASONKB_LOCAL_SOURCE_ACCESS_ROOT: /data/projects
      REASONKB_INDEX_WORKER_HEARTBEAT_FILE: /app/var/worker-health/index-worker.heartbeat
      REASONKB_SOURCE_WORKER_HEARTBEAT_FILE: /app/var/worker-health/source-worker.heartbeat
      REASONKB_MCP_HEALTH_URL: http://mcp-server:3002/health
      REASONKB_GOTENBERG_HEALTH_URL: http://gotenberg:3000/health
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_HOST_BROWSE_ROOT:-${HOME:-.}}:/host-browse:ro
      - ${REASONKB_ENV_FILE:-./.env}:/app/runtime.env
      - ${REASONKB_SECRETS_ROOT:-./secrets}/master.key:/run/secrets/reasonkb_master_key:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}/admin_password:/run/secrets/reasonkb_admin_password:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}/api_key_pepper:/run/secrets/reasonkb_api_key_pepper:ro
    depends_on:
      retrieval-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  mcp-server:
    restart: unless-stopped
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["node", "./tools/reasonkb-mcp.mjs", "--http"]
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-43173}:3002"
    environment:
      NODE_ENV: production
      REASONKB_URL: http://web:3000
      REASONKB_MCP_HOST: 0.0.0.0
      REASONKB_MCP_PORT: 3002
      REASONKB_MCP_ALLOWED_HOSTS: localhost,127.0.0.1,[::1],mcp-server,${REASONKB_MCP_ALLOWED_HOSTS:-}
      REASONKB_MCP_ALLOWED_ORIGINS: ${REASONKB_MCP_ALLOWED_ORIGINS:-}
      REASONKB_MCP_SESSION_MODE: ${REASONKB_MCP_SESSION_MODE:-stateless}
      REASONKB_MCP_PRE_AUTH_TIMEOUT_SECONDS: ${REASONKB_MCP_PRE_AUTH_TIMEOUT_SECONDS:-30}
      REASONKB_MCP_REQUEST_TIMEOUT_SECONDS: ${REASONKB_MCP_REQUEST_TIMEOUT_SECONDS:-600}
      REASONKB_MCP_MAX_CONCURRENT_REQUESTS: ${REASONKB_MCP_MAX_CONCURRENT_REQUESTS:-8}
      REASONKB_MCP_MAX_CONCURRENT_AUTH_REQUESTS: ${REASONKB_MCP_MAX_CONCURRENT_AUTH_REQUESTS:-32}
      REASONKB_MCP_MAX_CONCURRENT_CONTROL_REQUESTS: ${REASONKB_MCP_MAX_CONCURRENT_CONTROL_REQUESTS:-32}
      REASONKB_MCP_MAX_SESSIONS: ${REASONKB_MCP_MAX_SESSIONS:-128}
      REASONKB_MCP_SESSION_IDLE_TIMEOUT_SECONDS: ${REASONKB_MCP_SESSION_IDLE_TIMEOUT_SECONDS:-1209600}
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  retrieval-api:
    restart: unless-stopped
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/retrieval-api.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    ports:
      - "${RETRIEVAL_API_PORT:-43171}:8001"
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_EXTRACTION_ENABLED: ${VISION_EXTRACTION_ENABLED:-false}
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2).read()\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  index-worker:
    restart: unless-stopped
    mem_limit: "${INDEX_WORKER_MEMORY_LIMIT:-1g}"
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/index-worker.sh"]
    env_file:
      - path: ${REASONKB_ENV_FILE:-./.env}
        required: false
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      OFFICE_CONVERSION_TIMEOUT_SECONDS: ${OFFICE_CONVERSION_TIMEOUT_SECONDS:-120}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_EXTRACTION_ENABLED: ${VISION_EXTRACTION_ENABLED:-false}
      INDEX_DEBUG_METRICS: ${INDEX_DEBUG_METRICS:-false}
      INDEX_JOB_TIMEOUT_SECONDS: ${INDEX_JOB_TIMEOUT_SECONDS:-1800}
      INDEX_WORKER_CONCURRENCY: ${INDEX_WORKER_CONCURRENCY:-1}
      REASONKB_PDF_TABLE_MODE: ${REASONKB_PDF_TABLE_MODE:-html}
      REASONKB_REMOTE_CACHE_ROOT: ${REASONKB_REMOTE_CACHE_ROOT:-/app/var/remote-cache}
      REASONKB_MASTER_KEY_FILE: /run/secrets/reasonkb_master_key
      REASONKB_LOCAL_SOURCE_ACCESS_ROOT: /data/projects
      REASONKB_WORKER_HEARTBEAT_FILE: /app/var/worker-health/index-worker.heartbeat
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}/master.key:/run/secrets/reasonkb_master_key:ro
    depends_on:
      retrieval-api:
        condition: service_healthy
      gotenberg:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "services.common.worker_health", "/app/var/worker-health/index-worker.heartbeat", "120"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  source-worker:
    restart: unless-stopped
    image: ${REASONKB_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:latest}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    command: ["sh", "./docker/entrypoints/source-worker.sh"]
    environment:
      APP_VAR_ROOT: ${APP_VAR_ROOT:-/app/var}
      APP_DB_PATH: ${APP_DB_PATH:-/app/var/app.db}
      APP_UPLOAD_ROOT: ${APP_UPLOAD_ROOT:-/app/var/uploads}
      APP_CONVERTED_ROOT: ${APP_CONVERTED_ROOT:-/app/var/converted}
      PROJECTS_ROOT: /data/projects
      SOURCE_WORKER_POLL_SECONDS: ${SOURCE_WORKER_POLL_SECONDS:-1}
      REASONKB_MASTER_KEY_FILE: /run/secrets/reasonkb_master_key
      REASONKB_LOCAL_SOURCE_ACCESS_ROOT: /data/projects
      REASONKB_WORKER_HEARTBEAT_FILE: /app/var/worker-health/source-worker.heartbeat
    volumes:
      - ${REASONKB_VAR_ROOT:-./var}:/app/var
      - ${REASONKB_PROJECTS_ROOT:-./projects}:/data/projects:ro
      - ${REASONKB_SECRETS_ROOT:-./secrets}/master.key:/run/secrets/reasonkb_master_key:ro
    depends_on:
      retrieval-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "services.common.worker_health", "/app/var/worker-health/source-worker.heartbeat", "120"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  gotenberg:
    restart: unless-stopped
    image: ${GOTENBERG_IMAGE:-crpi-95tja6y49h58rco0.cn-shenzhen.personal.cr.aliyuncs.com/reasonkb/reasonkb:gotenberg-8}
    pull_policy: always
    platform: ${REASONKB_PLATFORM:-linux/amd64}
    ports:
      - "${GOTENBERG_PORT:-43172}:3000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
