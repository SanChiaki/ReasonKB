[project]
name = "reasonkb"
version = "0.1.0"
description = "Deployment-shared knowledge retrieval built on PageIndex"
requires-python = ">=3.11,<3.14"
dependencies = [
    "cryptography==46.0.3",
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "litellm==1.83.7",
    "pycryptodome==3.23.0",
    "pydantic==2.12.5",
    "pymupdf==1.26.4",
    "pypdf2==3.0.1",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "smbprotocol==1.16.1",
    "uvicorn==0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false
required-version = "==0.12.1"
